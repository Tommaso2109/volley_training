<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VolleyJump">
  <!-- Dice a iOS di usare questa icona nella schermata Home -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Fa aprire il sito a tutto schermo come una vera app (senza la barra di Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JumpTracker">
  <title>VolleyJump - Scheda Centrale</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #22c55e;
      --blue: #3b82f6;
      --yellow: #eab308;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 130px;
      padding-top: env(safe-area-inset-top);
      user-select: none;
    }
    header {
      padding: 20px 16px 12px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0 0 14px 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; justify-content: space-between; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tab {
      background: var(--card);
      border: 1px solid #334155;
      color: var(--muted);
      padding: 10px 6px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active-0 { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: var(--green); }
    .tab.active-1 { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: var(--blue); }
    .tab.active-2 { background: rgba(234, 179, 8, 0.15); color: #facc15; border-color: var(--yellow); }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .day-banner {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border-left: 5px solid var(--accent);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .day-title { font-size: 18px; font-weight: 800; margin: 0 0 6px 0; }
    .day-goal { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.45; }

    .progress-wrap {
      margin: 14px 0 4px 0;
      background: #0f172a;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-text { font-size: 12px; color: var(--muted); text-align: right; margin-top: 6px; font-weight: 600; }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid #334155;
    }
    .warmup-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed #475569;
    }
    .ex-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .ex-title { font-size: 16px; font-weight: 700; margin: 0; line-height: 1.3; }
    .ex-meta { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
    .ex-desc { font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-bottom: 14px; background: rgba(15, 23, 42, 0.5); padding: 12px; border-radius: 10px; }
    .ex-desc ol { margin: 6px 0 0 0; padding-left: 20px; }
    .ex-desc li { margin-bottom: 6px; }

    .sets-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 700; }
    .sets-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .set-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 2px solid #475569;
      background: #0f172a;
      color: var(--text);
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .set-btn.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #090d16;
      transform: scale(0.96);
    }

    .timer-triggers { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .btn-timer {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      active: opacity(0.8);
    }
    .btn-timer.work { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid #3b82f6; }
    .btn-timer.rest { background: rgba(244, 63, 94, 0.18); color: #fda4af; border: 1px solid #f43f5e; }

    .reset-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid #475569;
      color: var(--muted);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 12px;
      cursor: pointer;
    }

    /* Barra Timer Flottante in basso */
    .timer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid #334155;
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
    }
    .timer-info { display: flex; flex-direction: column; }
    .timer-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; }
    .timer-display { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
    .timer-controls { display: flex; gap: 8px; }
    .t-ctrl {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      background: #334155;
      color: white;
    }
    .t-ctrl.stop { background: #ef4444; }
  </style>
</head>
<body>

<header>
  <h1>
    <span>🏐 VolleyJump Pro</span>
  </h1>
  <div class="tabs">
    <div class="tab active-0" onclick="switchDay(0)" id="tab-0">🟢 Giorno 1</div>
    <div class="tab" onclick="switchDay(1)" id="tab-1">🔵 Giorno 2</div>
    <div class="tab" onclick="switchDay(2)" id="tab-2">🟡 Giorno 3</div>
  </div>
</header>

<div class="container" id="app-content"></div>

<div class="timer-bar">
  <div class="timer-info">
    <span class="timer-label" id="timer-label">Timer Pronto</span>
    <span class="timer-display" id="timer-display">00:00</span>
  </div>
  <div class="timer-controls">
    <button class="t-ctrl" onclick="startTimer(30, 'Lavoro 30s')">30s</button>
    <button class="t-ctrl" onclick="startTimer(90, 'Riposo 90s')">90s</button>
    <button class="t-ctrl" onclick="startTimer(120, 'Riposo 2m')">2m</button>
    <button class="t-ctrl stop" onclick="stopTimer()">Stop</button>
  </div>
</div>

<script>
const program = [
  {
    color: "#22c55e",
    title: "🟢 Giorno 1: Reattività della Caviglia & Forza Eccentrica",
    goal: "Insegnare ai tuoi tendini ad assorbire l'energia dell'atterraggio per spararti subito verso l'alto (fondamentale per le transizioni muro-attacco).",
    warmup: {
      text: "5 minuti di mobilità per anche e spalle + 2 minuti di skip basso a piedi nudi.",
      timers: [
        { sec: 300, label: "Mobilità (5 min)", type: "work" },
        { sec: 120, label: "Skip basso (2 min)", type: "work" }
      ]
    },
    exercises: [
      {
        id: "d1_e1",
        name: "1. Pogo Jumps (Extensive Plyometrics)",
        meta: "3 serie da 30 secondi",
        desc: "Salta sul posto usando solo le caviglie. I talloni non devono mai toccare terra. Immagina che il pavimento sia bollente: tocca e riparti il più velocemente possibile.",
        sets: 3,
        workSec: 30,
        restSec: 60
      },
      {
        id: "d1_e2",
        name: "2. Depth Drops da una sedia o gradino",
        meta: "4 serie da 5 ripetizioni • Riposo: 90s",
        desc: "Fai un passo giù dalla sedia, atterra a due piedi e \"inchioda\" la posizione in un mezzo squat senza rimbalzare. Il focus è assorbire l'impatto in modo silenzioso e controllato.",
        sets: 4,
        restSec: 90
      },
      {
        id: "d1_e3",
        name: "3. Squat con discesa lenta (4s) ed esplosione",
        meta: "4 serie da 6 ripetizioni",
        desc: "Scendi in 4 secondi mantenendo il controllo, fermati un secondo in basso (mezzo squat, la posizione da cui salti a muro), poi salta più in alto che puoi.",
        sets: 4,
        workSec: 4,
        workLabel: "Tempo Discesa (4s)",
        restSec: 90
      },
      {
        id: "d1_e4",
        name: "4. Affondi a forbice alternati (Jump Lunges)",
        meta: "3 serie da 10 salti totali",
        desc: "Alterna le gambe in volo mantenendo il busto eretto e spingendo con massima rapidità ed esplosività ad ogni cambio.",
        sets: 3,
        restSec: 60
      }
    ]
  },
  {
    color: "#3b82f6",
    title: "🔵 Giorno 2: Forza Concentrica & Massima Potenza da Fermo",
    goal: "Allena il \"salto da muro\": generare la massima spinta verticale partendo da una posizione statica, senza rincorsa.",
    warmup: {
      text: "5 minuti di squat a corpo libero e slanci delle gambe.",
      timers: [
        { sec: 300, label: "Riscaldamento (5 min)", type: "work" }
      ]
    },
    exercises: [
      {
        id: "d2_e1",
        name: "1. Non-Countermovement Squat Jumps",
        meta: "4 serie da 5 ripetizioni • Riposo: 2 min",
        desc: "Mettiti in posizione di mezzo squat (come quando aspetti il palleggiatore avversario a muro). Rimani immobile per 2 secondi completi per azzerare l'energia elastica. Senza scendere ulteriormente, salta verticalmente con la massima intenzione esplosiva. Atterra e resetta.",
        sets: 4,
        restSec: 120
      },
      {
        id: "d2_e2",
        name: "2. Bulgarian Split Squats",
        meta: "4 serie da 8 ripetizioni per gamba",
        desc: "Usa il divano per appoggiare il piede dietro. Se vuoi sovraccaricare, indossa uno zaino pieno di libri sul petto per simulare il lavoro con i pesi.",
        sets: 4,
        restSec: 90
      },
      {
        id: "d2_e3",
        name: "3. Skier Jumps (Salti Laterali)",
        meta: "3 serie da 20 secondi",
        desc: "Salta lateralmente da un piede all'altro spingendo forte. Allena la spinta laterale che usi per correre a chiudere il muro sulle bande.",
        sets: 3,
        workSec: 20,
        restSec: 60
      },
      {
        id: "d2_e4",
        name: "4. Glute Bridges a una gamba sola",
        meta: "3 serie da 12 ripetizioni per gamba",
        desc: "Ponti per i glutei monolaterali: spingi forte col tallone a terra e contrai il gluteo in cima per un secondo.",
        sets: 3,
        restSec: 60
      }
    ]
  },
  {
    color: "#eab308",
    title: "🟡 Giorno 3: Agilità Specifica del Centrale & Rincorsa Breve",
    goal: "Unisce i movimenti reali del tuo ruolo in campo con la pliometria ad alta intensità.",
    warmup: {
      text: "Rotazioni delle caviglie, delle ginocchia e simulazione di passi di accostamento a muro a vuoto.",
      timers: [
        { sec: 300, label: "Riscaldamento (5 min)", type: "work" }
      ]
    },
    exercises: [
      {
        id: "d3_e1",
        name: "1. Tuck Jumps (Salti al petto)",
        meta: "3 serie da 6 ripetizioni • Riposo: 90s",
        desc: "Salta verso l'alto e porta le ginocchia al petto in aria. Atterra e riparti immediatamente. Massima reattività.",
        sets: 3,
        restSec: 90
      },
      {
        id: "d3_e2",
        name: "2. Simulazione Muro-Transizione-Attacco",
        meta: "4 serie da 4 ripetizioni • Riposo: 2 min",
        desc: "<ol><li>Fai un salto massimale sul posto simulando il tempo di muro (mani alte).</li><li>Appena atterri, fai due passi rapidi all'indietro per \"aprire\" la traiettoria come faresti in partita per staccarti da rete.</li><li>Arrestati immediatamente e fai una rincorsa flash (1 o 2 passi al massimo) esplodendo verso l'alto simulando il colpo d'attacco in primo tempo.</li></ol>",
        sets: 4,
        restSec: 120
      },
      {
        id: "d3_e3",
        name: "3. Affondi laterali esplosivi (Side Lunges)",
        meta: "3 serie da 8 ripetizioni per lato",
        desc: "Spingi lateralmente per scendere nell'affondo e usa la stessa gamba per darti la spinta e tornare al centro con un balzo.",
        sets: 3,
        restSec: 60
      },
      {
        id: "d3_e4",
        name: "4. Plank standard + Plank laterale",
        meta: "3 serie da 45 secondi",
        desc: "Un core solido trasferisce tutta la forza delle gambe verso l'alto senza dispersioni.",
        sets: 3,
        workSec: 45,
        restSec: 45
      }
    ]
  }
];

let currentDay = parseInt(localStorage.getItem('vj_currentDay') || '0');
let progress = JSON.parse(localStorage.getItem('vj_progress') || '{}');
let timerInterval = null;
let audioCtx = null;

function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch (e) {}
}

function startTimer(seconds, label) {
  stopTimer();
  let remaining = seconds;
  document.getElementById('timer-label').innerText = label;
  updateTimerDisplay(remaining);

  timerInterval = setInterval(() => {
    remaining--;
    updateTimerDisplay(remaining);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      document.getElementById('timer-label').innerText = "✅ " + label + " Completato!";
      playBeep();
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('timer-label').innerText = "Timer Pronto";
  document.getElementById('timer-display').innerText = "00:00";
}

function updateTimerDisplay(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  document.getElementById('timer-display').innerText = `${m}:${s}`;
}

function toggleSet(exId, setIdx) {
  const key = `${exId}_s${setIdx}`;
  progress[key] = !progress[key];
  localStorage.setItem('vj_progress', JSON.stringify(progress));
  render();
}

function resetDay(dayIdx) {
  if (!confirm("Vuoi azzerare le serie completate di questo giorno?")) return;
  program[dayIdx].exercises.forEach(ex => {
    for (let i = 1; i <= ex.sets; i++) {
      delete progress[`${ex.id}_s${i}`];
    }
  });
  localStorage.setItem('vj_progress', JSON.stringify(progress));
  render();
}

function switchDay(idx) {
  currentDay = idx;
  localStorage.setItem('vj_currentDay', idx);
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.className = 'tab' + (i === idx ? ` active-${i}` : '');
  });
  render();
}

function render() {
  const day = program[currentDay];
  document.documentElement.style.setProperty('--accent', day.color);

  let totalSets = 0;
  let doneSets = 0;
  day.exercises.forEach(ex => {
    totalSets += ex.sets;
    for (let i = 1; i <= ex.sets; i++) {
      if (progress[`${ex.id}_s${i}`]) doneSets++;
    }
  });
  const pct = totalSets ? Math.round((doneSets / totalSets) * 100) : 0;

  let warmupTimers = day.warmup.timers.map(t =>
    `<button class="btn-timer work" onclick="startTimer(${t.sec}, '${t.label}')">⏱️ ${t.label}</button>`
  ).join('');

  let html = `
    <div class="day-banner">
      <h2 class="day-title">${day.title}</h2>
      <p class="day-goal">${day.goal}</p>
      <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="progress-text">Completamento: ${doneSets}/${totalSets} serie (${pct}%)</div>
    </div>

    <div class="card warmup-card">
      <div class="ex-header">
        <h3 class="ex-title">🔥 Riscaldamento</h3>
      </div>
      <div class="ex-desc" style="margin-bottom:8px">${day.warmup.text}</div>
      <div class="timer-triggers">${warmupTimers}</div>
    </div>
  `;

  day.exercises.forEach(ex => {
    let setsHtml = '';
    for (let i = 1; i <= ex.sets; i++) {
      const isDone = progress[`${ex.id}_s${i}`];
      setsHtml += `<button class="set-btn ${isDone ? 'done' : ''}" onclick="toggleSet('${ex.id}', ${i})">S${i}</button>`;
    }

    let timersHtml = '';
    if (ex.workSec) {
      const wLabel = ex.workLabel || `Lavoro (${ex.workSec}s)`;
      timersHtml += `<button class="btn-timer work" onclick="startTimer(${ex.workSec}, '${wLabel}')">⚡ ${wLabel}</button>`;
    }
    if (ex.restSec) {
      const rLabel = ex.restSec >= 60 && ex.restSec % 60 === 0 ? `${ex.restSec/60} min` : `${ex.restSec}s`;
      timersHtml += `<button class="btn-timer rest" onclick="startTimer(${ex.restSec}, 'Riposo ${rLabel}')">⏳ Riposo (${rLabel})</button>`;
    }

    html += `
      <div class="card">
        <div class="ex-header">
          <h3 class="ex-title">${ex.name}</h3>
        </div>
        <div class="ex-meta">${ex.meta}</div>
        <div class="ex-desc">${ex.desc}</div>
        <div class="sets-label">Tocca per completare la serie:</div>
        <div class="sets-row">${setsHtml}</div>
        <div class="timer-triggers">${timersHtml}</div>
      </div>
    `;
  });

  html += `<button class="reset-btn" onclick="resetDay(${currentDay})">🔄 Azzera progressi del Giorno ${currentDay + 1}</button>`;
  document.getElementById('app-content').innerHTML = html;
}

switchDay(currentDay);
</script>
</body>
</html>
